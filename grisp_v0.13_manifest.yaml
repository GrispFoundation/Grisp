rules:
  - id: MergeDuplicatePlannedTasks
    name: MergeDuplicatePlannedTasks
    priority: 95
    description: "Detect and merge duplicate planned tasks with identical normalized descriptions."
    metadata:
      idempotent: true
      use:
        - policy: RetentionAudit
      emits:
        - MERGE_TASKS
    when:
      patterns:
        - var: TaskA
          type: Task
          where: "lifecycle == 'planned'"
        - var: TaskB
          type: Task
          where: "lifecycle == 'planned' and TaskB.id != TaskA.id"
      lets:
        - name: NormA
          expr: "Normalize(TaskA.description)"
      conditions:
        - expr: "Normalize(TaskB.description) == NormA"
        - expr: "SamePlanOrigin(TaskA, TaskB)"
    then:
      actions:
        - let: Keep
          expr: "(TaskA.created_at <= TaskB.created_at ? TaskA : TaskB)"
        - let: Drop
          expr: "(Keep == TaskA ? TaskB : TaskA)"
        - update: "{{Keep}}"
          fields:
            tags: "Keep.tags + Drop.tags"
        - delete: "{{Drop}}"
        - emit:
            type: MERGE_TASKS
            payload:
              kept: "Keep.id"
              dropped: "Drop.id"

  - id: ActivatePlannedTask
    name: ActivatePlannedTask
    priority: 90
    description: "Flip planned tasks to pending when no blocking dependencies exist."
    metadata:
      idempotent: true
      depends_on:
        - MergeDuplicatePlannedTasks
      emits:
        - ACTIVATE_TASK
    when:
      patterns:
        - var: Task
          type: Task
          where: "lifecycle == 'planned'"
      conditions:
        - expr: "not exists edge depends_on(Task -> Dep) where Dep.lifecycle in ['pending','assigned','in_progress','waiting_tool']"
    then:
      actions:
        - update: Task
          fields:
            lifecycle: pending
            updated_at: "Now()"
        - emit:
            type: ACTIVATE_TASK
            payload:
              task: "Task.id"

  - id: AssignPendingTask
    name: AssignPendingTask
    priority: 80
    description: "Assign pending tasks to capable specialists."
    metadata:
      idempotent: false
      depends_on:
        - ActivatePlannedTask
      use:
        - policy: TimeoutRetry3x
        - policy: RateLimit
          params:
            max_per_tick: 200
            max_per_second: 1000
        - policy: CircuitBreakerDefault
      emits:
        - ASSIGN_TASK
    when:
      patterns:
        - var: Task
          type: Task
          where: "lifecycle == 'pending' and cost = Cost"
        - var: Specialist
          type: Agent
          where: "role == 'Specialist' and capacity_total - capacity_used >= Cost"
      conditions:
        - expr: "CanExecute(Specialist, Task)"
    then:
      actions:
        - let: NewCapacity
          expr: "Specialist.capacity_used + Cost"
        - update: Task
          fields:
            lifecycle: assigned
            updated_at: "Now()"
        - update: Specialist
          fields:
            capacity_used: "NewCapacity"
        - create: assigns
          spec:
            from: Specialist
            to: Task
        - emit:
            type: ASSIGN_TASK
            payload:
              task: "Task.id"
              agent: "Specialist.id"
    hooks:
      after_commit:
        - emit_assignment_webhook

  - id: CreateToolRequest
    name: CreateToolRequest
    priority: 60
    description: "Create a ToolRequest for in-progress tasks when needed."
    metadata:
      idempotent: false
      depends_on:
        - StartAssignedTask
      use:
        - policy: RateLimit
          params:
            max_per_tick: 200
            max_per_second: 1000
        - policy: CircuitBreakerDefault
      emits:
        - CREATE_TOOL_REQUEST
    when:
      patterns:
        - var: Task
          type: Task
          where: "lifecycle == 'in_progress' and description = Desc"
      conditions:
        - expr: "exists edge assigns(Agent -> Task)"
        - expr: "not exists TR where TR.task == Task and TR.status in ['pending','running']"
    then:
      actions:
        - let: RK
          expr: "GenerateRequestKey(Task, Desc)"
        - update: Task
          fields:
            lifecycle: waiting_tool
            updated_at: "Now()"
        - create: TR
          spec:
            id: "NewId()"
            kind: "DecideToolKind(Desc)"
            input: "Desc"
            status: pending
            created_at: "Now()"
            task: Task
            request_key: RK
        - create: tool_for_task
          spec:
            from: TR
            to: Task
        - emit:
            type: CREATE_TOOL_REQUEST
            payload:
              task: "Task.id"
              request: "TR.id"
    hooks:
      after_commit:
        - schedule_tool_request_timeout
        - emit_tool_request_webhook
